- name: Activar el reenvío de paquetes de forma permanente
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/90-router.conf
    sysctl_set: true
    state: present

# iptables-persistent carga /etc/iptables/rules.v4 en el arranque
- name: Instalar iptables e iptables-persistent
  ansible.builtin.apt:
    name:
      - iptables
      - iptables-persistent
    state: present
    update_cache: true
    cache_valid_time: 3600

# La interfaz de salida es la de la ruta por defecto (la de la red NAT)
- name: Configurar el NAT (masquerade) de la red de datos
  ansible.builtin.template:
    src: rules.v4.j2
    dest: /etc/iptables/rules.v4
    mode: "0640"
  notify: Cargar las reglas de iptables

- name: Arrancar netfilter-persistent y habilitarlo en el arranque
  ansible.builtin.service:
    name: netfilter-persistent
    state: started
    enabled: true
