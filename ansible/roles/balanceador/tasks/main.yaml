- name: Instalar HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present

# validate: si la configuración tiene errores no se copia
- name: Configurar HAProxy
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"
    validate: haproxy -c -f %s
  notify: Reiniciar haproxy

- name: Arrancar HAProxy y habilitarlo en el arranque
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
