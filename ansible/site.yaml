# Primero web hace de router: web2, bd y backup salen a internet a través de él
- name: Router/NAT
  hosts: balanceador
  become: true
  gather_facts: false
  pre_tasks:
    - name: Esperar a que web acepte conexiones
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Recoger facts
      ansible.builtin.setup:
  roles:
    - router

# web2, bd y backup pueden tardar en arrancar: se espera a que acepte SSH antes de recoger facts
- name: Configuración común
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Esperar a que las máquinas acepten conexiones
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Recoger facts
      ansible.builtin.setup:
  roles:
    - commons

- name: Servidor de base de datos
  hosts: servidores_bd
  become: true
  roles:
    - bd

- name: Servidores web
  hosts: servidores_web
  become: true
  roles:
    - web

# Después de web: Apache ya ha dejado libre el puerto 80 para HAProxy
- name: Balanceador de carga
  hosts: balanceador
  become: true
  roles:
    - balanceador

# backup hace las copias de la base de datos por la red de datos
- name: Copias de seguridad
  hosts: servidores_backup
  become: true
  roles:
    - backup
