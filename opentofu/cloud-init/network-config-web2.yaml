network:
  version: 2
  ethernets:
    ens3:
      dhcp4: false
      addresses: ["10.10.10.11/24"]     # red de datos (única interfaz)
      routes:
        - to: default
          via: 10.10.10.10              # sale a internet a través de web
      nameservers:
        addresses: ["192.168.140.1"]    # DNS de la red NAT, alcanzable a través de web
